name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Lint + testes (Linux, com LibreOffice)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dependências do sistema (Qt off-screen, LibreOffice, 7-Zip)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 \
            libreoffice-writer libreoffice-calc libreoffice-impress p7zip-full p7zip-rar
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check src tests tools
      - name: Compilação de todos os módulos
        run: python -m compileall -q src tools
      - name: Testes
        run: python -m pytest -q -ra

  windows:
    name: Testes (Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      ALFRED_TEST_REGISTRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Testes (motores do pip + 7-Zip do runner; LibreOffice é testado no workflow de release)
        run: python -m pytest -q -ra
